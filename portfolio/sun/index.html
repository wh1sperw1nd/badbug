        <script type="text/javascript">
			
            $(document).ready(function() {
				if($.browser.mozilla && $.browser.version >= 4) {
					$('#sun_yellow').css({"border-radius":"100px","box-shadow":"0 0 60px #F7EB38","background":"#F7EB38"});
					$('#sun_red').css({"border-radius":"100px","box-shadow":"0 0 60px #ff0000","background":"#ff0000"});
				}else if($.browser.webkit && $.browser.version >= 5) {
					$('#sun_yellow').css({"border-radius":"100px","box-shadow":"0 0 60px #F7EB38","background":"#F7EB38"});
					$('#sun_red').css({"border-radius":"100px","box-shadow":"0 0 60px #ff0000","background":"#ff0000"});
				}else if($.browser.opera && $.browser.version >= 10) {
					$('#sun_yellow').css({"border-radius":"100px","box-shadow":"0 0 60px #F7EB38","background":"#F7EB38"});
					$('#sun_red').css({"border-radius":"100px","box-shadow":"0 0 60px #ff0000","background":"#ff0000"});
				}
				else if($.browser.msie && $.browser.version >= 9) {
					$('#sun_yellow').css({"border-radius":"100px","box-shadow":"0 0 60px #F7EB38","background":"#F7EB38"});
					$('#sun_red').css({"border-radius":"100px","box-shadow":"0 0 60px #ff0000","background":"#ff0000"});
				}
                $('#sun_yellow').animate({'top':'96%','opacity':0.4}, 12000,function(){
                    $('#stars').animate({'opacity':1}, 5000,function(){
                        $('#moon').animate({'top':'10%','opacity':1}, 5000, function(){
                            $('#sstar').animate({'opacity':1}, 300);
                            $('#sstar').animate({'backgroundPosition':'0px 0px','top':'15%', 'opacity':0
                            }, 4000,function(){
                                $('#title').animate({'opacity':1}, 1000);
                                $('#back').animate({'opacity':1}, 3000);
                            });
                        });
                    });
                });
                $('#sun_red').animate({'top':'96%','opacity':0.8}, 12000);
                $('#sky').animate({'backgroundColor':'#4F0030'}, 18000);
                $('#clouds').animate({'backgroundPosition':'1000px 0px','opacity':0}, 20000);
                $('#night').animate({'opacity':0.8}, 20000);
            });
        </script>
    </body>
