<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1024" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Presentation</title>
    
    <meta name="description" content="impress.js is a presentation tool based on the power of CSS3 transforms and transitions in modern browsers and inspired by the idea behind prezi.com." />
    <meta name="author" content="Bartek Szopka" />

    <link href="//fonts.googleapis.com/css?family=Open+Sans:regular,semibold,italic,italicsemibold|PT+Sans:400,700,400italic,700italic|PT+Serif:400,700,400italic,700italic" rel="stylesheet" />
    <link href="./css/impress-demo.css" rel="stylesheet" />
    <link href="./css/door.css" rel="stylesheet" />
    <link rel="shortcut icon" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
</head>

<body class="impress-not-supported">

<div id="impress" data-autoplay="7">

    <div id="bored" class="step" data-x="-1000" data-y="-1500" data-autoplay="10">
        <div class="perspective">
            <div class="thumb"></div>
            <div class="inner"><q>Slide 1</q></div>
        </div>
    </div>

    <div class="step" data-x="0" data-y="-1500">
        <div class="perspective">
            <div class="thumb"></div>
            <div class="inner"><q>Slide 2</q></div>
        </div>
    </div>

    <div class="step" data-x="1000" data-y="-1500">
        <div class="perspective">
            <div class="thumb"></div>
            <div class="inner"><q>Slide 3</q></div>
        </div>
    </div>

    <div id="title" class="step" data-x="0" data-y="0" data-scale="4">
        <div class="perspective">
            <div class="thumb"></div>
            <div class="inner"><q>Slide 4</q></div>
        </div>
    </div>

    <div id="its" class="step" data-x="850" data-y="3000" data-rotate="90" data-scale="5">
        <div class="perspective">
            <div class="thumb"></div>
            <div class="inner"><q>Slide 5</q></div>
        </div>
    </div>

    <div id="big" class="step" data-x="3500" data-y="2100" data-rotate="180" data-scale="6">
        <div class="perspective">
            <div class="thumb"></div>
            <div class="inner"><q>Slide 6</q></div>
        </div>
    </div>

    <div id="tiny" class="step" data-x="2825" data-y="2325" data-z="-3000" data-rotate="300" data-scale="1">
        <div class="perspective">
            <div class="thumb"></div>
            <div class="inner"><q>Slide 7</q></div>
        </div>
    </div>

    <div id="ing" class="step" data-x="3500" data-y="-850" data-z="0" data-rotate="270" data-scale="6">
        <div class="perspective">
            <div class="thumb"></div>
            <div class="inner"><q>Slide 8</q></div>
        </div>
    </div>

    <div id="imagination" class="step" data-x="6700" data-y="-300" data-scale="6">
        <div class="perspective">
            <div class="thumb"></div>
            <div class="inner"><q>Slide 9</q></div>
        </div>
    </div>

    <div id="source" class="step" data-x="6300" data-y="2000" data-rotate="20" data-scale="4">
        <div class="perspective">
            <div class="thumb"></div>
            <div class="inner"><q>Slide 10</q></div>
        </div>
    </div>

    <div id="one-more-thing" class="step" data-x="6000" data-y="4000" data-scale="2">
        <div class="perspective">
            <div class="thumb"></div>
            <div class="inner"><q>Slide 11</q></div>
        </div>
    </div>

    <div id="its-in-3d" class="step" data-x="6200" data-y="4300" data-z="-100" data-rotate-x="-40" data-rotate-y="10" data-scale="2">
        <div class="perspective">
            <div class="thumb"></div>
            <div class="inner"><q>Slide 12</q></div>
        </div>
    </div>

    <div id="overview" class="step" data-x="3000" data-y="1500" data-z="0" data-scale="10">
    </div>

</div>

<div id="impress-toolbar"></div>

<div class="hint">
    <p>Use a spacebar or arrow keys to navigate. <br/>
       Press 'P' to launch speaker console.</p>
</div>
<script>
if ("ontouchstart" in document.documentElement) { 
    document.querySelector(".hint").innerHTML = "<p>Swipe left or right to navigate</p>";
}
</script>
<script src="./js/jquery-3.3.1.min.js"></script>
<script src="./js/impress.js"></script>
<script>
    $(document).ready(function(){
        impress().init();
        function openDoor(field) {
            var y = $(field).find(".thumb");
            var x = y.attr("class");
            var z = $(field).find(".inner");
            if (y.hasClass("thumbOpened")) {
                y.removeClass("thumbOpened");
                $(z).css("display", "none");
            }
            else {
                $(z).css("display", "block");
                $(".thumb").removeClass("thumbOpened");
                y.addClass("thumbOpened");
            }
        }
        $(".perspective").click(function(e){
            console.error(e)
            openDoor(e.currentTarget);
        })
    });

</script>

</body>
</html>
