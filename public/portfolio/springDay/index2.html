<script>
    window.requestAnimationFrame = window.requestAnimationFrame || window.mozRequestAnimationFrame ||
        window.webkitRequestAnimationFrame || window.msRequestAnimationFrame;

    var starDensity = .216;
    var speedCoeff = .05;
    var width;
    var height;
    var starCount;
    var circleRadius;
    var circleCenter;
    var first = true;
    var giantColor = '180,184,240';
    var starColor = '226,225,142';
    var cometColor = '226,225,224';
    var canva = document.getElementById('universe');
    var stars = [];

    windowResizeHandler();
    window.addEventListener('resize', windowResizeHandler, false);

    function createUniverse() {
        universe = canva.getContext('2d');

        for (var i = 0; i < starCount; i++) {
            stars[i] = new Star();
            stars[i].reset();
        }

        draw();
    }

    function draw() {
        universe.clearRect(0, 0, width, height);

        var starsLength = stars.length;

        for (var i = 0; i < starsLength; i++) {
            var star = stars[i];
            star.move();
            star.fadeIn();
            star.fadeOut();
            star.draw();
        }

        window.requestAnimationFrame(draw);
    }

    function Star() {

        this.reset = function () {
            this.giant = getProbability(3);
            this.comet = this.giant || first ? false : getProbability(10);
            this.x = getRandInterval(0, width - 10);
            this.y = getRandInterval(0, height);
            this.r = getRandInterval(1.1, 2.6);
            this.dx = getRandInterval(speedCoeff, 6 * speedCoeff) + (this.comet + 1 - 1) * speedCoeff * getRandInterval(50, 120) + speedCoeff * 2;
            this.dy = -getRandInterval(speedCoeff, 6 * speedCoeff) - (this.comet + 1 - 1) * speedCoeff * getRandInterval(50, 120);
            this.fadingOut = null;
            this.fadingIn = true;
            this.opacity = 0;
            this.opacityTresh = getRandInterval(.2, 1 - (this.comet + 1 - 1) * .4);
            this.do = getRandInterval(0.0005, 0.002) + (this.comet + 1 - 1) * .001;
        };

        this.fadeIn = function () {
            if (this.fadingIn) {
                this.fadingIn = this.opacity > this.opacityTresh ? false : true;
                this.opacity += this.do;
            }
        };

        this.fadeOut = function () {
            if (this.fadingOut) {
                this.fadingOut = this.opacity < 0 ? false : true;
                this.opacity -= this.do / 2;
                if (this.x > width || this.y < 0) {
                    this.fadingOut = false;
                    this.reset();
                }
            }
        };

        this.draw = function () {
            universe.beginPath();

            if (this.giant) {
                universe.fillStyle = 'rgba(' + giantColor + ',' + this.opacity + ')';
                universe.arc(this.x, this.y, 2, 0, 2 * Math.PI, false);
            } else if (this.comet) {
                universe.fillStyle = 'rgba(' + cometColor + ',' + this.opacity + ')';
                universe.arc(this.x, this.y, 1.5, 0, 2 * Math.PI, false);

                //comet tail
                for (var i = 0; i < 30; i++) {
                    universe.fillStyle = 'rgba(' + cometColor + ',' + (this.opacity - (this.opacity / 20) * i) + ')';
                    universe.rect(this.x - this.dx / 4 * i, this.y - this.dy / 4 * i - 2, 2, 2);
                    universe.fill();
                }
            } else {
                universe.fillStyle = 'rgba(' + starColor + ',' + this.opacity + ')';
                universe.rect(this.x, this.y, this.r, this.r);
            }

            universe.closePath();
            universe.fill();
        };

        this.move = function () {
            this.x += this.dx;
            this.y += this.dy;
            if (this.fadingOut === false) {
                this.reset();
            }
            if (this.x > width - (width / 4) || this.y < 0) {
                this.fadingOut = true;
            }
        };

        (function () {
            setTimeout(function () {
                first = false;
            }, 50)
        })()
    }

    function getProbability(percents) {
        return ((Math.floor(Math.random() * 1000) + 1) < percents * 10);
    }

    function getRandInterval(min, max) {
        return (Math.random() * (max - min) + min);
    }

    function windowResizeHandler() {
        width = window.innerWidth;
        height = window.innerHeight;
        starCount = width * starDensity;
        // console.log(starCount)
        circleRadius = (width > height ? height / 2 : width / 2);
        circleCenter = {
            x: width / 2,
            y: height / 2
        }

        canva.setAttribute('width', width);
        canva.setAttribute('height', height);
    }

            for (var i = 0; i < particles.length; i++) {
                var p = particles[i];
                if (!p.inText) {
                    // p.px = p.mx;
                    // p.py = p.my;
                    // p.opacity = 1;
                    p.fadeOut();

                    var X = p.mx - p.px;
                    Y = p.my - p.py;

                    var T = Math.sqrt(X * X + Y * Y);

                    var A = Math.atan2(Y, X);

                    var C = Math.cos(A);

                    var S = Math.sin(A);

                    p.x = p.px + C * T * p.delta / 2;
                    p.y = p.py + S * T * p.delta / 2;
                    p.px = p.x;
                    p.py = p.y;

                    draw(p);
                }

            }

        };


        var setDimensions = function () {
            // width = window.innerWidth;
            // height = window.innerHeight;

            canvas.width = window.innerWidth >= 420 ? 1500 : width;
            canvas.height = window.innerHeight >= 150 ? 150 : height;

            width = canvas.width;
            height = canvas.height;

            canvas.style.position = 'absolute';
            canvas.style.left = '-75px';
            canvas.style.top = '0px';
            canvas.style.bottom = '0px';
            canvas.style.right = '0px';
            canvas.style.marginTop = window.innerHeight * .15 + 'px';
        };

        var setGradient = function (gradientStops) {


            gradient = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, width);


            for (var position in gradientStops) {
                var color = gradientStops[position];
                gradient.addColorStop(position, color);
            }
        };

        /**
         * Public Methods
         */
        return {
            init: function (canvasID) {
                canvas = document.getElementById(canvasID);
                if (canvas === null || !canvas.getContext) {
                    return;
                }
                ctx = canvas.getContext("2d");
                setDimensions();
                this.event();

                for (var i = 0; i < PARTICLE_NUM; i++) {
                    particles[i] = new Particle(canvas);
                }


                setInterval(loop, FRAME_RATE);
            },

            event: function () {
                var end = false;
                console.log(texts.length)
                document.addEventListener('click', function (e) {
                    textNum++;
                    if (textNum >= texts.length) {
                        textNum--;
                        end = true;
                        return;
                    }
                    text = texts[textNum];
                    console.log(textNum)
                }, false);
            }
        };
    })();


    var Particle = function (canvas) {

        var range = Math.random() * 180 / Math.PI,
            spread = canvas.height / 4,
            size = Math.random() * 1.2;

        this.delta = 0.15;
        this.x = 0;
        this.y = 0;

        this.px = (canvas.width / 2) + ((Math.random() - 0.5) * canvas.width);
        this.py = (canvas.height * 0.5) + ((Math.random() - 0.5) * spread);

        this.mx = this.px;
        this.my = this.py;

        this.velocityX = Math.floor(Math.random() * 10) - 5;
        this.velocityY = Math.floor(Math.random() * 10) - 5;

        this.size = size;
        this.origSize = size;

        this.inText = false;

        this.opacity = 0;
        this.do = 0.02;

        this.opacityTresh = 0.98
        this.fadingOut = true;
        this.fadingIn = true;
        this.fadeIn = function () {
            this.fadingIn = this.opacity > this.opacityTresh ? false : true;
            if (this.fadingIn) {
                this.opacity += this.do;
            } else {
                this.opacity = 1;
            }
        };

        this.fadeOut = function () {
            this.fadingOut = this.opacity < 0 ? false : true;
            if (this.fadingOut) {
                this.opacity -= 0.06;
                if (this.opacity < 0) {
                    this.opacity = 0
                }
            } else {
                this.opacity = 0
            }
        };
    };

    // credit to the original svg https://www.vectorstock.com/royalty-free-vector/flat-with-shadow-icon-and-mobile-application-kiss-vector-6341903

    var master = new TimelineMax();
    var couple = $('#couple');
    var girl = $('#girl');
    var boy = $('#boy');
    var heart = $('#heart');
    var ground = $('#ground');
    var background = $('body');
    var light = $('#triangle-light');
    // $('.container').append(new Array(50).join('<div class="heart"></div>'));


    master
        .add(createUniverse)
        .add(setup)
        .add(darkness, 'lightsOff+=1')
        .add(girlKiss, 'girlStuff+=1')
        .add(boyStuff, 'girlStuff+=2')
        .add(heartStuff, 'heartStuff')
        .add(lightsOn, 'heartStuff+=2');


    function setup() {
        var tl = new TimelineMax();
        tl
            .set(couple, {autoAlpha: 1})
            .set(girl.find('#girl-earring'), {scaleY: '0.7'})
            .set(girl.find('#girl-leg-1'), {rotation: '+=75'})
            .set(girl.find('#girl-arm'), {transformOrigin: '100% 0%', rotation: '-=60'})
            .set(girl.find('#girl-body'), {transformOrigin: '0% 75%', rotation: '+=20'})
            .set(heart, {transformOrigin: '50% 50%', y: '+=100', scale: 0.5});

        return tl;
    }


    function darkness() {
        var tl = new TimelineMax();
        tl.to(background, 1, {backgroundColor: '#1a2124'});
        return tl;
    }

    function girlKiss() {
        var tl = new TimelineMax();
        tl
            .to(girl.find('#girl-arm'), 1, {rotation: 0})
            .to(girl.find('#girl-body'), 0.5, {transformOrigin: '0% 75%', rotation: 0})
            .to(girl.find('#girl-eye'), 0.5, {transformOrigin: '0% 50%', scaleY: 0.1}, 1.25)
            .to(girl.find('#girl-leg-1'), 1.5, {rotation: 0, ease: Back.easeOut.config(3)}, 1.25);

        return tl;
    }


    function boyStuff() {
        var tl = new TimelineMax();
        tl
            .to(boy.find('#boy-eye'), 0.5, {transformOrigin: '0% 50%', scaleY: 0.1})

        return tl;
    }

    function heartStuff() {
        var tl = new TimelineMax();
        tl
            .to('#heart', 1, {autoAlpha: 1, y: 0, scale: 1});
        return tl;
    }


    function lightsOn() {
        var tl = new TimelineMax();
        tl
            .to(light, 0.25, {autoAlpha: 1}, 0)
            .to(ground, 0.25, {fill: '#F8E5C5'}, 0)
            .to(girl.find('#girl-eye'), 0.5, {scaleY: 1}, 0.5)
            .to(boy.find('#boy-eye'), 0.5, {scaleY: 1}, 1)
            .to(girl.find('#girl-leg-1'), 1, {rotation: '+=75'})
            .to(girl.find('#girl-body'), 0.5, {rotation: '+=20'})
            .to(Clock.init('canvas'), 0.5);


        return tl;

    }
</script>
